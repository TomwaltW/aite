# Aite P0 编排（owner: RΩ，dev-spec-2026-09-11-rustgo.md §2.1 进程模型 / §5 归属表）
#
# **两个常驻进程**，各自既是 gRPC server 也是 client，走 data/run 下的两个 unix socket：
#
#   core（Rust，`aite run`）  监听 data/run/aite-core.sock  —— IngressService
#   edge（Go，`aite-edge`）   监听 data/run/aite-edge.sock  —— Platform/Sandbox/EdgeStatus
#
# 沙箱不是这里的常驻 service —— 它由 **edge** 用 Docker client 按任务起**兄弟容器**
# （标签 `aite.task=<task_id>`），所以只有 edge 需要 /var/run/docker.sock。
# core 这一侧压根不认识 Docker，别给它挂（多挂一份就是白白多一个提权面）。
# 镜像 `aite-sandbox:p0` 由下面那个 `sandbox-image` service 建（profile: images）——
# edge 只 `ImageInspect`、**不 pull**（edge/internal/sandbox/docker.go:168-172），
# 镜像不在就报「沙箱镜像不存在」。所以起飞前必须先建好它，`make compose-up` 会连它一起建。
#
# **只跑一个副本**：同一飞书应用的多副本长连接只有一个能收到事件（Python spec 附录 A 末条）。
# 这条约束现在落在 edge 上 —— 它才是拿着长连接的那个。
#
# **启动顺序无关**（§2.1）：两边都是懒连接 + 指数退避重连（1→2→…→30s 封顶），
# 所以刻意**不写 depends_on** —— 谁先起都行，先起的那个会等另一个。
# core 起飞时会问一次 edge 的 `GetStatus`：`contract_version` 不等就拒绝起飞；
# 问不到（edge 还没起）就记一行 `aite.edge_unreachable` 照常起飞。
# 下面两个 healthcheck 也**不许**被拿去当启动顺序用（不加
# `depends_on: condition: service_healthy`）—— 它们只是让人在 `docker compose ps` 里
# 看得见谁就绪，不是排序机制。
#
# 密钥一律走环境变量，compose 文件里只出现变量名，而且**按进程分**：
# 飞书三项只有 edge 用得上（出站入站都在它那儿），模型密钥只有 core 用得上。
# 本地用法：把取值放进仓库根的 .env，或直接 export 后再 docker compose up。
# ⚠️ `docker compose config` 会把 `${VAR}` **解析成取值**再打出来 —— 它的完整输出是带密钥的，
#    别往回执/工单/聊天里贴。要给人看用 `docker compose config --services`，
#    要校验语法用 `env -u FEISHU_APP_ID -u FEISHU_APP_SECRET -u FEISHU_BOT_OPEN_ID \
#    -u AITE_MODEL_API_KEY docker compose config -q`（Makefile 的 compose-config 就是这个口径）。
#
# **构建形态（2026-09-12 V1 改）**：真镜像，两个多阶段 Dockerfile。
# 上一版是「把仓库挂进去、在容器里现编」，代价被低估了三处，现在都没了：
#
# 1. `cargo build` 的产物落进宿主机仓库的 `core/target`（本机实测 6.5G）。linux 与 darwin
#    两个 host triple 挤同一个目录：`.fingerprint`/`deps` 按 triple 分所以不会互相重编，
#    但 **`target/debug/` 下的顶层 uplift 产物是后编者覆盖前编者** —— 容器编完那一刻，
#    宿主机的 `core/target/debug/aite` 是个 ELF，scripts/check.sh 与 docs/acceptance-M.md
#    里所有直接 exec 它的命令全报 exec format error，直到有人在宿主机上再 `cargo build` 一次。
#    现在编译在 builder 阶段、`CARGO_TARGET_DIR=/target`，仓库树一个字节都不碰。
# 2. Go 的 module 缓存在容器层（只给了 GOCACHE 的卷，没给 /go/pkg/mod），
#    `down` 之后再 `up` 把 233M 依赖重下一遍（实测每个新容器 12–14s）。
#    现在走 builder 阶段的 BuildKit cache mount。
# 3. 运行层带着整条 Rust/Go 工具链。现在是 debian:trixie-slim + 一个二进制。
#
# 编译期踩过的三个坑，改成真镜像之后是**从形态上**没了，不是靠写法绕开的
# （逐条证据见 review/paste-V1.md 的回执）：
#   · 登录 shell 洗掉 PATH  → 运行层 `ENTRYPOINT ["aite"]` 直接 exec 二进制，不过 shell；
#                              运行层里压根没有 cargo / go
#   · rust 镜像里没 protoc → 编译全在 builder 阶段，运行层不编东西
#   · cwd 必须是 /app      → Dockerfile 的 `WORKDIR /app` + 这里的 `working_dir: /app`
#   · socket 落对地方       → 共享命名卷仍然挂 /app/data/run，两边 working_dir 都是 /app
name: aite

services:
  edge:
    # 对外连接面：飞书长连接 + REST、Docker 沙箱
    build:
      context: .
      dockerfile: docker/edge/Dockerfile
    image: aite-edge:p0
    # 仓库根，不是 /app/edge：socket / 配置里的路径全相对仓库根
    working_dir: /app
    # 以谁的身份跑（2026-09-13 AA1 降权）—— 完整理由在 docker/core/Dockerfile 的
    # 「以谁的身份跑」小节。这里只说旋钮：镜像里的默认身份是 1001:1001，而 `./data`
    # 是 bind mount、宿主机那边归**当前用户**，当前用户的 uid 每台机器都不一样，
    # 所以真正的取值要从宿主机传进来。**core 与 edge 必须是同一个 uid** ——
    # 两个进程互相 connect 对方的 unix socket，而 connect 要 socket 文件的写权限，
    # socket 是 `srwxr-xr-x`、只有属主有写位（实测：uid 1001 连 root 建的 socket 是
    # Permission denied）。
    #   Linux：  AITE_UID=$(id -u) AITE_GID=$(id -g) docker compose up -d
    #   macOS：  不用管，VirtioFS 双向翻译 uid，默认值就行
    user: "${AITE_UID:-1001}:${AITE_GID:-1001}"
    # 只有 edge 需要这一条：它要读 /var/run/docker.sock，而那个 socket 不归上面这个 uid。
    # **这个 gid 每台宿主机不一样**：Docker Desktop 上容器里看到的是 root:root 0660
    # （所以默认 0 正好对），Linux 上是 root:docker、gid 各机器不同（常见 999/998），
    # **默认 0 在 Linux 上是错的**。从 socket 自己问出来最稳，CI 就是这么传的：
    #   AITE_DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)
    # 传错的后果不是静默的：daemon 连不上 → Ping 失败 → EdgeStatus.sandbox_ok false
    # → `aite preflight` 第 6 组 FAIL 并点名沙箱不可用。
    #
    # **默认值为什么还是 0 —— 2026-09-15（BB3）把这个决定翻出来复审过一次，维持。**
    # `make compose-up` 现在自己把这个值问出来了（真 socket 就 stat，符号链接就落回 0），
    # 所以这个默认值只在「绕开 make、手敲 docker compose up」时才起作用 —— 而那一档里
    # 唯一「默认值本来就正确」的平台正是 Docker Desktop。
    # 改成空（`${AITE_DOCKER_GID:-}`）的后果实测过，不划算：`docker compose config -q`
    # **照样退 0**（便宜的那道解析门禁根本接不住它，CI 那条 `config --services` 同理），
    # 要到真起容器那一刻才死在
    #   `Error response from daemon: unable to find group : no matching entries in group file`（退 125）
    # —— 等于把一条「preflight 第 6 组 FAIL 并点名沙箱不可用」的**带诊断的**失败，换成一条
    # 没诊断的 daemon 报错，还把 macOS 这个本来没病的平台一起拖下水。
    # 代价如实写在这儿：**Linux 上不传这个变量时，edge 会多拿一个用不上的 root 补充组**
    # （gid 0 只是补充组，不是 euid，但它确实让 edge 读得到 root 组可读的文件 ——
    # 走 `make compose-up` 就没这回事）。
    group_add:
      - "${AITE_DOCKER_GID:-0}"
    # 默认两个 service 吃同一份 config/aite.yaml —— 那是真机验收（docs/acceptance-M.md）
    # 的形态，别的都别想。两个环境变量只是给「要让两边吃不同配置」的场合留的口子：
    # core 与 edge 读的是**同一个 platform 字段**，而 `platform: fake` 对两边的含义相反
    # （core 拒绝起飞、edge 不起长连接只提供 gRPC 面），所以 CI 冒烟与没有飞书凭证的
    # 本机要两边同时真起，只能给 edge 换一份 platform: fake 的配置。
    command: ["--config", "${AITE_EDGE_CONFIG:-config/aite.yaml}"]
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
    volumes:
      # 真配置 config/aite.yaml 不入库（.gitignore 的 `config/aite.yaml` 那条），只能挂进来。
      # 挂的是整个目录而不是那一个文件：文件不存在时 docker 会替你建一个**同名空目录**，
      # 那种错比「配置读不到」难查得多。
      - ./config:/app/config:ro
      # data/ 必须是 bind mount：SQLite 与证据链要在宿主机上看得到，
      # 否则 docs/acceptance-M.md §0.3 的第二个观察窗（evidence show）直接废掉。
      # ⚠️ **Linux 上起飞前先 `mkdir -p data`** —— 走 `make compose-up` 的话它自己做了
      #    （2026-09-15 BB3），手敲 `docker compose up -d` 才要自己敲。
      #    这个目录**本身**入库（data/.gitkeep），**内容**不入库（.gitignore 的 `/data/*`
      #    + `!/data/.gitkeep` 两条；2026-09-15 之前是一条 `/data/`，行号也因此漂过一次，
      #    所以这里不再写行号）。目录不在的话 dockerd 会替你建成 root:root 0755，
      #    而上面 `user:` 里那个非 root 身份写不进去 —— core 会死在建表那一步。
      #    macOS 撞不到（VirtioFS 翻译 uid）。
      - ./data:/app/data
      # 两个 socket 都落在这里，两个 service 共享它（比 ./data 那层更深，所以盖住它）
      - run:/app/data/run
      # 沙箱是兄弟容器：只有 edge 需要 docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
    # edge 的 gRPC server 注册了标准 health（internal/server/server.go:38-40），
    # 与三个业务服务同一个 unix socket。探针二进制烤在镜像里（docker/edge/Dockerfile）。
    healthcheck:
      test:
        - CMD
        - grpc-health-probe
        - -addr=unix:///app/data/run/aite-edge.sock
        - -connect-timeout=2s
        - -rpc-timeout=2s
      interval: 5s
      timeout: 5s
      retries: 3
      # 真镜像之后起飞是秒级（不再现编）。给 15s 是留给 daemon 慢的机器，
      # 不是计时器 —— 崩溃循环靠 restart 计数看，不靠这个。
      start_period: 15s
    restart: unless-stopped
    # 默认 json-file 驱动**无上限**，配 restart: unless-stopped，崩溃循环时日志涨得很快。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # edge 的收尾：GracefulStop gRPC（上限 10s）→ 关长连接（上限 5s）→ 还沙箱
    stop_grace_period: 20s
    deploy:
      replicas: 1

  core:
    # 状态与判定面：路由、会话、worker、证据、模型
    build:
      context: .
      dockerfile: docker/core/Dockerfile
    image: aite-core:p0
    working_dir: /app
    # 见 edge 那边同一条注释 —— **两个 service 必须解析出同一个 uid:gid**，
    # 它们互相 connect 对方的 unix socket。core 不碰 docker daemon，所以没有 group_add。
    user: "${AITE_UID:-1001}:${AITE_GID:-1001}"
    # 见 edge 那边同一条注释：默认就是 config/aite.yaml。
    command: ["run", "--config", "${AITE_CORE_CONFIG:-config/aite.yaml}"]
    environment:
      AITE_MODEL_API_KEY: ${AITE_MODEL_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - run:/app/data/run
    # core 的 ingress **没有** gRPC health service（edge-client/src/ingress.rs 只
    # add_service(IngressServiceServer)），`aite` 也没有 status 子命令。所以判据是
    # 「ingress socket connect 得上」——`ingress.listening` 是起飞的最后一步，
    # connect 得上就等于前面每一步都过了。
    # 必须真 connect，不能 `test -S`：优雅退出（SIGTERM）那条路 ingress.stop() 会把
    # socket 文件自己收掉，但 SIGKILL / panic / OOM 这条路不走 stop()，文件就留在命名卷里
    # （ingress.rs 的「删残留」只在下次 bind 时才跑）。实测：SIGKILL 之后
    # `test -S` 返回 0（假绿），`nc -U -z` 是 Connection refused、退 1。
    # 判据**刻意不依赖 edge**：edge 没起时 core 记一行 aite.edge_unreachable 照常起飞，
    # 那是正常状态，不是不健康。
    healthcheck:
      test: ["CMD", "nc", "-U", "-z", "/app/data/run/aite-core.sock"]
      interval: 5s
      timeout: 3s
      retries: 3
      # edge 压根没起时 core 会先退避重试 GetStatus（attempts=5），记一行
      # aite.edge_unreachable 再照常起飞 —— 实测从 `up -d core` 到 healthy 是 5s。
      # 给 15s 是留给 daemon 慢的机器，不是计时器。
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # 对齐 `run_app` 的 DEFAULT_SHUTDOWN_GRACE_SEC = 20.0：
    # SIGTERM 之后 core 要把在跑的任务收完（platform.stop → plane.join(20s) → 还沙箱 → 关库）
    stop_grace_period: 20s
    deploy:
      replicas: 1

  # 沙箱镜像 —— **只为 build 存在的 service**，不是常驻进程。
  # 放在 profile 里：`docker compose up` / `docker compose config --services` 都看不见它
  # （CI 那条 `grep -qx 'core edge '` 因此不受影响），只有点名带 profile 才建：
  #   docker compose --profile images build sandbox-image
  # 内容归 R2，这里一个字都不改，只是把「一条命令起得来」补齐。
  sandbox-image:
    profiles: ["images"]
    image: aite-sandbox:p0
    build:
      context: docker/sandbox
    # 万一真被 up 起来，让它立刻干净退出，别变成一个 sleep infinity 的僵尸
    command: ["true"]
    restart: "no"

volumes:
  # 两个进程的 unix socket。用命名卷而不是让它跟着 ./data 那份 bind mount 走：
  # socket 是进程间的运行期产物，不该往宿主机仓库里落（.gitignore 也挡着 /data/run/）。
  #
  # ⚠️ **这个卷的挂载点属主不是在这里定的，是从镜像里抄的**（2026-09-13 AA1 实测）：
  # 空卷第一次被挂上时，Docker 把镜像里 `/app/data/run` 的属主与权限位抄到卷根上，
  # 而且只要卷里还没有文件，每挂一次抄一次。两个 Dockerfile 因此写着**逐字一样**的
  # `mkdir -p /app/data/run && chmod 1777` —— 不一致的话卷属主就取决于「谁先起」，
  # 而这里刻意不写 depends_on，顺序无保证。
  # 换了 `AITE_UID` 之后要 `docker compose down -v`：sticky 位只许属主删自己的文件，
  # 上一个 uid 的残留 socket 新 uid 删不掉（会响，不是静默）。
  run:
