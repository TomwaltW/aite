# Aite P0 编排（owner: RΩ，dev-spec-2026-09-11-rustgo.md §2.1 进程模型 / §5 归属表）
#
# **两个常驻进程**，各自既是 gRPC server 也是 client，走 data/run 下的两个 unix socket：
#
#   core（Rust，`aite run`）  监听 data/run/aite-core.sock  —— IngressService
#   edge（Go，`aite-edge`）   监听 data/run/aite-edge.sock  —— Platform/Sandbox/EdgeStatus
#
# 沙箱不是这里的 service —— 它由 **edge** 用 Docker client 按任务起**兄弟容器**
# （标签 `aite.task=<task_id>`），所以只有 edge 需要 /var/run/docker.sock。
# core 这一侧压根不认识 Docker，别给它挂（多挂一份就是白白多一个提权面）。
# 镜像 `aite-sandbox:p0` 由 `docker build -t aite-sandbox:p0 docker/sandbox` 单独构建。
#
# **只跑一个副本**：同一飞书应用的多副本长连接只有一个能收到事件（Python spec 附录 A 末条）。
# 这条约束现在落在 edge 上 —— 它才是拿着长连接的那个。
#
# **启动顺序无关**（§2.1）：两边都是懒连接 + 指数退避重连（1→2→…→30s 封顶），
# 所以刻意**不写 depends_on** —— 谁先起都行，先起的那个会等另一个。
# core 起飞时会问一次 edge 的 `GetStatus`：`contract_version` 不等就拒绝起飞；
# 问不到（edge 还没起）就记一行 `aite.edge_unreachable` 照常起飞。
#
# 密钥一律走环境变量，compose 文件里只出现变量名，而且**按进程分**：
# 飞书三项只有 edge 用得上（出站入站都在它那儿），模型密钥只有 core 用得上。
# 本地用法：把取值放进仓库根的 .env，或直接 export 后再 docker compose up。
# ⚠️ `docker compose config` 会把 `${VAR}` **解析成取值**再打出来 —— 它的完整输出是带密钥的，
#    别往回执/工单/聊天里贴。要给人看用 `docker compose config --services`，
#    或者 `env -u FEISHU_APP_SECRET -u AITE_MODEL_API_KEY docker compose config`。
#
# P0 的构建形态沿用 Python 版那套「把仓库挂进去、在容器里现编」——
# 仓库里没有 core/edge 的 Dockerfile，也没到要做多阶段镜像的时候。
# 代价是每次重启都重编一次（cargo/go 的缓存放在命名卷里，第二次很快）。
#
# 两条 command 的写法有三处是**踩过坑才这么写的**，别顺手改回去：
#
# 1. `bash -c`，**不是 `-lc`**。`-l` 会 source /etc/profile，Debian 的 profile 把 PATH
#    重置成系统默认，官方镜像的工具链（/usr/local/go/bin、/usr/local/cargo/bin）不在里面 ——
#    `go` / `cargo` 当场 command not found（exit 127）。脚本第一行还是显式 export 了一次 PATH，
#    这样哪天真有人把 -l 加回来也炸不了。
# 2. 两个进程都**以 /app（仓库根）为 cwd** exec。config/aite.yaml 里的路径按契约全是
#    相对仓库根的（worker.system_prompt_path、storage.sqlite_path、edge.*_socket）——
#    在 /app/core 或 /app/edge 里 exec，core 会在 require_system_prompt 就 StartupError 退 2，
#    edge 会把 socket 建到 /app/edge/data/run/（那儿不是共享卷），两个进程永远连不上。
#    所以是 `cd <子目录> && 编译 && cd /app && exec ...`，working_dir 也都写 /app。
# 3. core 要现装 protoc（rust 镜像里没有，core/crates/proto 的 build.rs 必须要）。
#    来源与 CI 的 arduino/setup-protoc@v3（version: "31.x"）同一个：protocolbuffers/protobuf
#    的官方 release 二进制。装进 CARGO_HOME 那个命名卷，重启不重下。
name: aite

services:
  edge:
    # 对外连接面：飞书长连接 + REST、Docker 沙箱
    image: golang:1.27
    # 仓库根，不是 /app/edge：socket / 配置里的路径全相对仓库根（见抬头第 2 条）
    working_dir: /app
    command:
      - bash
      - -c
      - |
        set -e
        export PATH=/usr/local/go/bin:/go/bin:$$PATH
        cd edge && go build -o /usr/local/bin/aite-edge ./cmd/aite-edge
        cd /app && exec aite-edge --config config/aite.yaml
    environment:
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_BOT_OPEN_ID: ${FEISHU_BOT_OPEN_ID:-}
      GOCACHE: /gocache
    volumes:
      - ./:/app
      # 两个 socket 都落在这里，两个 service 共享它
      - run:/app/data/run
      # 沙箱是兄弟容器：只有 edge 需要 docker daemon
      - /var/run/docker.sock:/var/run/docker.sock
      - gocache:/gocache
    restart: unless-stopped
    # edge 的收尾：GracefulStop gRPC（上限 10s）→ 关长连接（上限 5s）→ 还沙箱
    stop_grace_period: 20s
    deploy:
      replicas: 1

  core:
    # 状态与判定面：路由、会话、worker、证据、模型
    image: rust:1.98
    working_dir: /app
    command:
      - bash
      - -c
      - |
        set -e
        export PATH=/usr/local/cargo/bin:/cargo/protoc/bin:$$PATH
        if ! command -v protoc >/dev/null 2>&1; then
          v=31.1
          case "$$(uname -m)" in aarch64|arm64) a=aarch_64 ;; *) a=x86_64 ;; esac
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v$$v/protoc-$$v-linux-$$a.zip"
          unzip -q -o /tmp/protoc.zip -d /cargo/protoc
          rm -f /tmp/protoc.zip
        fi
        protoc --version
        cd core && cargo build --workspace
        cd /app && exec core/target/debug/aite run --config config/aite.yaml
    environment:
      AITE_MODEL_API_KEY: ${AITE_MODEL_API_KEY:-}
      RUST_LOG: ${RUST_LOG:-info}
      CARGO_HOME: /cargo
    volumes:
      # 源码与 config/aite.yaml 一起挂进去；data/ 在仓库里，落盘的 SQLite 与
      # evidence 因此在宿主机上直接看得到（StorageConfig 的默认路径）
      - ./:/app
      - run:/app/data/run
      - cargo:/cargo
    restart: unless-stopped
    # 对齐 `run_app` 的 DEFAULT_SHUTDOWN_GRACE_SEC = 20.0：
    # SIGTERM 之后 core 要把在跑的任务收完（platform.stop → plane.join(20s) → 还沙箱 → 关库）
    stop_grace_period: 20s
    deploy:
      replicas: 1

volumes:
  # 两个进程的 unix socket。用命名卷而不是让它跟着 ./ 那份 bind mount 走：
  # socket 是进程间的运行期产物，不该往宿主机仓库里落（.gitignore 也挡着 /data/run/）。
  run:
  cargo:
  gocache:
