# dev-spec §3.8 / 09_bot_ignored
# sender_kind=bot 的 @ → 无会话、无出站（§3.5 R1：机器人/应用/系统消息永远不触发任务）
name: 09_bot_ignored
title: 机器人 @ 我也不接活
verifies: sender_kind=bot 的 @ → 无会话、无出站
spec_ref: "§3.8 09_bot_ignored；§3.5 R1"

events:
  - event_id: e1
    text: 帮我算一下这个月的账
    mentioned: true
    sender_id: cli_other_bot
    sender_kind: bot
    sender_name: 别家机器人

# 模型一次都不该被调用，所以脚本是空的：真被调了就会以「模型脚本已用尽」失败
model_script: []

expect:
  - {check: outbound_total, equals: 0}
  - {check: model_calls, equals: 0}
  - {check: store, sessions_equals: 0, tasks_equals: 0}
  - {check: platform_calls, method: add_reaction, equals: 0}
