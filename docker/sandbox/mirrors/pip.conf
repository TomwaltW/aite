# 沙箱运行期的 pip 源（owner: CC12；Dockerfile 在 pip install 那层之后才 COPY 到 /etc/pip.conf）。
#
# network=none（今天的唯一档）下它不起作用；等 china-trusted 档放行这些主机后才生效（CC11 预设逐主机对照）。
# index-url 用清华、extra-index-url 用阿里：清华是 CC11 china-trusted 预设里的主源、同步最勤；
# 注意 pip 的 extra-index-url **不是**故障切换，而是两边的候选合并后挑版本——阿里在这里是补位，
# 清华缺某个 wheel 时从阿里拿。两边都是 PyPI 全量镜像，不存在「同名不同包」的投毒面差异。
[global]
index-url = https://pypi.tuna.tsinghua.edu.cn/simple
extra-index-url = https://mirrors.aliyun.com/pypi/simple/
