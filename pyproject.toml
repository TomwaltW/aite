[project]
name = "aite"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6",
  "httpx>=0.27",
  "lark-oapi>=1.4",        # 飞书官方 SDK（长连接 + IM API）
  "openai>=1.40",          # 只用作 OpenAI-compatible 客户端，指向百炼/智谱
  "docker>=7",             # Docker SDK，沙箱
  "aiosqlite>=0.20",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["docker: 需要本机 Docker daemon 的测试"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

# ↓ 以下是 T0 为让 A1（pip install -e）跑通而加的构建配置。
# 不属于 3.0 冻结的「依赖 / pytest / ruff」三块，不改任何契约字段、名字、默认值。
# 原因：3.4 的目录布局在仓库根造了 evals/、docker/、config/，setuptools 平铺布局
# 会把它们一并当成顶层包（docker/ 还会遮蔽 docker SDK 依赖），导致 flat-layout 报错。
[tool.setuptools.packages.find]
include = ["aite*"]

# 显式声明构建后端：不写这段的话 pip 回退到 legacy 后端，五个 worktree + T4 的 CI
# 各自依赖 pip 当时注入的 setuptools 版本，装出来的东西不可复现。
# setuptools 是构建期依赖，不进 [project.dependencies]，运行期不引入任何新东西。
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
