[package]
name = "aite-evals"
description = "评测 runner / 场景 / checks / protocol probe / demo-fixture（对应旧 aite/evals/** 与 scripts/demo_fixture.py）。owner: R7"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aite-contracts.workspace = true
aite-testing.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
chrono.workspace = true
async-trait.workspace = true
tokio.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true
# FutureExt::catch_unwind —— 场景执行中的 panic 收成 phase="error"，
# 而不是带走整套评测。futures 已在 workspace 依赖表里（R0 钉的），不是新增第三方依赖。
futures.workspace = true

[dev-dependencies]
# test-util 让测试能暂停/推进 tokio 时钟（纪律 4：不靠真实 sleep）
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
