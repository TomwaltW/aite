[package]
name = "aite-edge-client"
description = "PlatformPort / SandboxPort 的 gRPC 实现（tonic client 到 Go edge）+ IngressService server。owner: R6"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
aite-contracts.workspace = true
aite-proto.workspace = true
tonic.workspace = true
tokio.workspace = true
# net 给 UnixListenerStream（IngressServer 的 incoming）；tonic 的 server feature 也要它
tokio-stream = { workspace = true, features = ["net"] }
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
chrono.workspace = true
serde_json.workspace = true
