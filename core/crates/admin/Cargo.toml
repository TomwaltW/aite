[package]
name = "aite-admin"
description = "管理台（axum 服务端渲染，`aite admin serve`）。骨架 crate：CC1 预建，W2 由 DD12 填。owner: DD12"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 依赖是 CC1 按 DD12 原卡预先声明的，全部取自 [workspace.dependencies]、都已在 Cargo.lock 里，不是新依赖。
# 这一份刻意「宁少勿多」：DD12 本来就要加 axum 并改锁（计划 D4 / D12），缺什么届时一并加。
# 不声明 aite-gateway：管理台只读写配置与证据，不注册工具。
# aite-contracts 取 Scope / Bundle / 证据的类型；serde / serde_json 出表单与 JSON 接口；
# tokio / async-trait 是服务端与存储端口的异步面；thiserror 出错误类型；tracing 记登录与审计日志；
# chrono 给会话超时、登录锁定窗口算时间。
[dependencies]
aite-contracts.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true

[dev-dependencies]
tokio.workspace = true
tempfile.workspace = true
