# Aite CI —— Rust（core/）+ Go（edge/）。门禁 = docs/dev-spec-2026-09-11-rustgo.md §4 的 A1–A5 + C1/C2。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: edge/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.x"

      - name: "A1 cargo build --workspace"
        run: cd core && cargo build --workspace
      - name: "A2 go build ./..."
        run: cd edge && go build ./...
      - name: "A3 契约锁 lock --check"
        run: core/target/debug/aite contracts lock --check
      - name: "A4 lint"
        run: |
          cd core && cargo clippy --workspace --all-targets -- -D warnings && cargo fmt --check
          cd ../edge && go vet ./... && test -z "$(gofmt -l .)"
      - name: "A5 cargo test --no-run"
        run: cd core && cargo test --workspace --no-run
      - name: "C1 契约测试"
        run: cd core && cargo test -p aite-contracts
      - name: "B cargo test（全量）"
        run: cd core && cargo test --workspace --no-fail-fast
      # -race 不是可选项：Go 侧的并发面（长连接重连、令牌桶、容器记账表、gRPC 并发读
      # capabilities）都不是单线程的，而竞态在普通 go test 下完全隐形 —— 七轨合流审核那次
      # 就是靠它抓出 fakeFeishu 的读取侧没持锁。与 scripts/check.sh 同口径。
      - name: "B go test -race（不含 docker tag）"
        run: cd edge && go test -race ./... -count=1
      # B8 —— RΩ 接线之后它是**硬门禁**：passed 10/10 + 退出码 0（§4.2）。
      # 这一步红 = 十个 P0 场景里有跑不过的，不许合。
      - name: "B8 评测（硬门禁：passed 10/10）"
        run: core/target/debug/aite evals run evals/p0 --platform fake --model scripted
      # compose 从 RΩ 起是两个 service（core + edge），文件本身也要能被解析。
      # 刻意清掉那几个密钥环境变量：`docker compose config` 会把 ${VAR} 解析成取值再打出来。
      - name: "compose 双 service 可解析"
        run: |
          env -u FEISHU_APP_ID -u FEISHU_APP_SECRET -u FEISHU_BOT_OPEN_ID -u AITE_MODEL_API_KEY \
            docker compose config --services | sort | tr '\n' ' ' | grep -qx 'core edge '
