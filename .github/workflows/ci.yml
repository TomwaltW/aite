# Aite CI —— Rust（core/）+ Go（edge/）。门禁 = docs/dev-spec-2026-09-11-rustgo.md §4 的 A1–A5 + C1/C2。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.98.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: edge/go.sum
      - uses: arduino/setup-protoc@v3
        with:
          version: "31.x"

      - name: "A1 cargo build --workspace"
        run: cd core && cargo build --workspace
      - name: "A2 go build ./..."
        run: cd edge && go build ./...
      - name: "A3 契约锁 lock --check"
        run: core/target/debug/aite contracts lock --check
      - name: "A4 lint"
        run: |
          cd core && cargo clippy --workspace --all-targets -- -D warnings && cargo fmt --check
          cd ../edge && go vet ./... && test -z "$(gofmt -l .)"
      - name: "A5 cargo test --no-run"
        run: cd core && cargo test --workspace --no-run
      - name: "C1 契约测试"
        run: cd core && cargo test -p aite-contracts
      - name: "B cargo test（全量）"
        run: cd core && cargo test --workspace --no-fail-fast
      - name: "B go test（不含 docker tag）"
        run: cd edge && go test ./... -count=1
      # B8 —— RΩ 才要求 passed 10/10 退出码 0。并行期间是 not implemented（退出码 2），先不阻塞；
      # RΩ 合流后删掉 continue-on-error，它就变成硬门禁。
      - name: "B8 评测（RΩ 前不阻塞）"
        continue-on-error: true
        run: core/target/debug/aite evals run evals/p0 --platform fake --model scripted
